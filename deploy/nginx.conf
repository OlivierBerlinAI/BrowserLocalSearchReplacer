# nginx server block for a host nginx in front of the app (Docker container or
# systemd service, both on 127.0.0.1:8080). Get the certificate with certbot
# (`certbot --nginx -d dont-tell.olivier.berlin`), which fills in the ssl_* lines.
# nginx passes the upstream's headers (Content-Security-Policy etc.) through
# unchanged, so do not add your own add_header for them: an add_header in this
# block would replace, not extend, the upstream set.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dont-tell.olivier.berlin;

    # ssl_certificate     /etc/letsencrypt/live/dont-tell.olivier.berlin/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/dont-tell.olivier.berlin/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name dont-tell.olivier.berlin;
    return 301 https://$host$request_uri;
}
