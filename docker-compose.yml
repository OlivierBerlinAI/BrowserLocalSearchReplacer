# App only, for a host that already runs nginx (or another proxy) with HTTPS.
# The container serves plain HTTP on 127.0.0.1:${PORT:-8080}; nginx terminates
# TLS and proxies to it (see deploy/nginx.conf). Not reachable from outside.
# Usage: docker compose up -d      (PORT=8090 docker compose up -d for another port)
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
